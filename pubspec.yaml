name: guardian_portal
description: Portal web Guardian Sense — Centro de Segurança (Flutter Web).
publish_to: 'none'
version: 1.0.8+9 # portal — a cada deploy: +patch e +build; alinhar AppConstants
# Build hosting: scripts/deploy_hosting.ps1 (usa --pwa-strategy=none)

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.0.4
  go_router: ^17.3.0
  intl: ^0.20.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/shield_transparent.png
