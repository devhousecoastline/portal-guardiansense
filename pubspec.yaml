name: guardian_portal
description: Portal web Guardian Sense — Centro de Segurança (Flutter Web).
publish_to: 'none'
version: 1.0.16+17 # portal — a cada deploy: +patch e +build; alinhar AppConstants
# Build hosting: scripts/deploy_hosting.ps1 (usa --pwa-strategy=none)

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  go_router: ^18.0.0
  intl: ^0.20.2
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/shield_transparent.png
